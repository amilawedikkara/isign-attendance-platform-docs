  /api/v1/devices/activate:
    post:
      tags:
      - Device Registration
      summary: Activate Registered Device
      description: 'Activate a previously registered mobile device using SMS OTP.


        The OTP field name is otp, not sms_otp.

        After successful activation, startup authentication should return status_id
        = 1 and the app can open the Dashboard.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - location_code
              - device_uuid
              - otp
              properties:
                location_code:
                  type: string
                  example: GAL-001
                device_uuid:
                  type: string
                  example: TEST-DEVICE-032
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Device activation result with device/location details after successful activation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Device activated successfully
                  device:
                    type: object
                    nullable: true
                    description: Returned when activation succeeds so the mobile app can save location data for startup authentication.
                    properties:
                      location_id:
                        type: integer
                        example: 107
                      location_code:
                        type: string
                        example: MOB-TEST-001
                      location_name:
                        type: string
                        example: Mobile Test Branch
                      status_id:
                        type: integer
                        example: 1
                      status_name:
                        type: string
                        example: Active
        '400':
          description: Missing location_code, otp, or device_uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/devices/authenticate:
    post:
      tags:
      - Device Registration
      summary: Authenticate Registered Device
      description: 'Authenticate a registered service-location device during mobile
        app startup.


        Startup routing rules confirmed by testing:

        - If success = false, redirect to Register Device screen.

        - If success = true and device.status_id = 2, redirect to Activation screen.

        - If success = true and device.status_id = 1, open Dashboard.


        The tested endpoint is POST /api/v1/devices/authenticate.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_uuid
              - location_id
              properties:
                device_uuid:
                  type: string
                  example: TEST-DEVICE-032
                location_id:
                  type: integer
                  example: 9
      responses:
        '200':
          description: Device authentication result. Active registered devices should return success=true and status_id=1.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Device authenticated successfully
                  device:
                    type: object
                    nullable: true
                    description: Returned when a registered device is found for the provided device_uuid and location_id.
                    properties:
                      location_id:
                        type: integer
                        example: 107
                      location_name:
                        type: string
                        example: Mobile Test Branch
                      status_id:
                        type: integer
                        example: 1
                      status_name:
                        type: string
                        example: Active
        '400':
          description: device_uuid and location_id are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

