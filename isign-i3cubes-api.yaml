      summary: Register Device
      description: 'Register a mobile device for trusted service-location attendance
        usage.


        Confirmed tested flow:

        1. Mobile app submits location_code, auto-detected device_uuid, auto-detected
        device_model, and platform.

        2. Backend validates the location_code.

        3. Backend creates the device registration.

        4. Device remains inactive until OTP activation is completed using POST /api/v1/devices/activate.


        Important: location_id, status_id, and sms_otp are not sent in this registration
        request.

        One service location can only have one registered device. If another device
        is already registered to the target location, registration is denied.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - location_code
              - device_uuid
              - device_model
              - platform
              properties:
                location_code:
                  type: string
                  example: GAL-001
                device_uuid:
                  type: string
                  example: TEST-DEVICE-032
                device_model:
                  type: string
                  example: Samsung A25
                platform:
                  type: string
                  example: Android
      responses:
        '200':
          description: Device registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Device registered successfully
        '400':
          description: Invalid location code or business-rule validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Another device is registered to the location
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
